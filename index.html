<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AVA · Reconocimiento de Grupos Funcionales</title>
<link rel="stylesheet" href="css/estilo.css">
<style>
  .hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:1.5rem;align-items:center;margin-top:.5rem}
  .hero h1{font-size:3rem;line-height:1.05}
  .hero h1 em{font-style:normal;color:var(--O)}
  .hero .visor{height:360px}
  @media(max-width:820px){.hero{grid-template-columns:1fr}.hero h1{font-size:2.2rem}}
</style>
</head>
<body>
<main>
  <section class="hero">
    <div>
      <div class="eti">Ambiente Virtual de Aprendizaje · Química Orgánica</div>
      <h1>Mira la molécula.<br>Sigue el árbol.<br><em>Nombra el grupo.</em></h1>
      <p>Una herramienta para reconocer los <strong>13 grupos funcionales</strong> básicos a partir de patrones estructurales, recorriendo un diagrama secuencial en forma de árbol.</p>
      <p><span class="chip hc">Hidrocarburos</span> <span class="chip ox">Oxigenados</span> <span class="chip ni">Nitrogenados</span></p>
    </div>
    <div>
      <div class="visor" id="v"></div>
      <p class="eti" id="lbl" style="text-align:center;margin-top:.4rem"></p>
    </div>
  </section>
  <div class="ruta" id="ruta"></div>
</main>
<script src="lib/three.min.js"></script>
<script src="js/config.js"></script>
<script src="js/moleculas.js"></script>
<script src="js/arbol.js"></script>
<script>
  AVA_ARBOL.nav('index.html');
  const L = AVA_ARBOL.leer;
  const pre = L('pre'), post = L('post'), tal = L('taller');
  const pasos = [
    ['modulos/prueba-inicial.html', 'Paso 1 · Prueba inicial', pre ? 'Presentada: ' + pre.aciertos + ' de 13' : '13 preguntas para conocer tu punto de partida', !!pre],
    ['modulos/presentacion.html', 'Paso 2 · Aprende con el AVA', tal ? 'Taller completado: ' + tal.aciertos + ' de 13' : 'Módulos 1 a 6: árbol, ejemplos y taller', !!tal],
    ['modulos/prueba-final.html', 'Paso 3 · Prueba final', post ? 'Presentada: ' + post.aciertos + ' de 13 · ver Mi informe' : 'Las mismas 13 preguntas para medir tu avance', !!post]
  ];
  let sig = pasos.findIndex(p => !p[3]);
  document.getElementById('ruta').innerHTML = pasos.map((p, i) =>
    `<a href="${p[0]}" class="${p[3] ? 'hecho' : (i === sig ? 'siguiente' : '')}"><b>${p[3] ? '✔ ' : ''}${p[1]}</b><small>${p[2]}</small></a>`).join('');
  const v = new AVA_MOL.Visor(document.getElementById('v'));
  const rot = ['propanamida', 'etanoatometilo', 'benceno', 'propanonitrilo', 'propanoico'];
  let k = 0;
  function sigM() { const d = v.cargar(rot[k++ % rot.length]); document.getElementById('lbl').textContent = d.nombre + ' · ' + d.formula; }
  sigM(); setInterval(sigM, 7000);
</script>
</body>
</html>
